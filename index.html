<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Management System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
:root{
  --bg:#0f1720;--panel:#17222c;--panel2:#1d2a35;--line:#2a3947;--text:#dbe6ee;--muted:#8fa2b3;
  --accent:#4fb8d1;--green:#42c090;--purple:#8f83e0;--warn:#e0a545;--danger:#e2635c;--chip:#1d2a35;--r:12px;
  --input:#1a2530;--head:linear-gradient(90deg,#132534,#0f1720);
  --sidebar-bg:#0c1e28;--sidebar-text:#cfe0e8;--sidebar-line:#1c3542;--sidebar-hover:#16303c;
  --font-sans:'DM Sans',-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
[data-theme="light"]{
  --bg:#eef3f8;--panel:#ffffff;--panel2:#eef2f7;--line:#dde5ee;--text:#1c2b3a;--muted:#5b6b7c;
  --chip:#eef2f7;--input:#f7f9fc;--head:linear-gradient(90deg,#eaf2f8,#f5f8fb);
  --accent:#1f7a94;--green:#1f8f68;--purple:#6f5fd6;--warn:#b4771c;--danger:#d1453f;
  --sidebar-bg:#163243;--sidebar-text:#e3edf3;--sidebar-line:#244a5c;--sidebar-hover:#1d4356;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-sans)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.fl{display:block;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:12px}
.app-shell{min-height:100vh;display:flex}
.sidebar{width:236px;flex-shrink:0;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:25}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-name{font-weight:700;font-size:15px;color:#fff;white-space:nowrap}
.brand-name .b{color:var(--accent)}
.brand-sub{font-size:10px;color:var(--sidebar-text);opacity:.6;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;white-space:nowrap}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--sidebar-text);opacity:.45;padding:6px 10px}
header{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--head);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
header h1{display:none}
.mobile-menu{display:none;background:none;border:none;color:var(--text);font-size:19px;cursor:pointer;padding:4px 8px}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav button{background:none;border:none;color:var(--sidebar-text);opacity:.78;padding:10px 12px;border-radius:9px;font-size:13.3px;font-weight:600;text-align:left;width:100%;display:flex;align-items:center;gap:9px;transition:background .15s,transform .15s}
nav button:hover{background:var(--sidebar-hover);opacity:1;transform:translateX(2px)}
nav button.on{background:var(--accent);color:#fff;opacity:1;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.spacer{flex:1}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--sidebar-line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.cloud{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sidebar-text);background:var(--sidebar-hover);border:1px solid var(--sidebar-line);border-radius:999px;padding:6px 12px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--green)}
.dot.err{background:var(--danger)}
.tbtn{background:var(--sidebar-hover);border:1px solid var(--sidebar-line);color:var(--sidebar-text);border-radius:8px;padding:7px 11px;font-size:12.5px}
.tbtn:hover{background:var(--sidebar-line)}
.main-area{flex:1;min-width:0;display:flex;flex-direction:column}
main{padding:26px 30px;max-width:1320px;margin:0 auto;width:100%}
@media (max-width:880px){
  .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-105%);transition:transform .25s;box-shadow:15px 0 40px rgba(0,0,0,.25)}
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:grid;place-items:center}
  main{padding:18px 16px}
}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(10,20,30,.05)}
.kpi::after{content:'';width:64px;height:64px;border:13px solid var(--accent);opacity:.09;border-radius:50%;position:absolute;right:-20px;top:-20px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:25px;font-weight:700;margin-top:4px}
.kpi .v.g{color:var(--green)}
.kpi .v.p{color:var(--purple)}
.kpi .v.w{color:var(--warn)}
.kpi .v.d{color:var(--danger)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:18px;box-shadow:0 6px 22px rgba(10,20,30,.04)}
.panel h3{margin:0 0 14px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:13.3px}
th{text-align:left;color:var(--muted);font-weight:650;font-size:11.3px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.tablewrap{overflow-x:auto}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:650;display:inline-block}
.b-new{background:#15314f;color:#79b8ff}
.b-old{background:#2b2147;color:#c4a9ff}
.b-active{background:#10301f;color:#74e6b4}
.b-nonactive{background:#3a1d22;color:#ff9c9c}
.b-male{background:#15314f;color:#79b8ff}
.b-female{background:#3a1830;color:#ffa3d6}
.b-paid{background:#10301f;color:#74e6b4}
.b-unpaid{background:#3a2e12;color:#ffcd7a}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);border:1px solid var(--line)}
.btn{border:none;border-radius:8px;padding:9px 16px;font-weight:650;font-size:13px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--accent);color:#fff}
.btn.save{background:var(--green);color:#04231a}
.btn.del{background:#2a1d22;color:var(--danger);border:1px solid #44262c}
.btn.ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.x{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px}
.x:hover{color:var(--danger)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0c2a1f;border:1px solid var(--green);color:#aef5da;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:80vw;z-index:100}
.toast.show{opacity:1}
.toast.bad{background:#2a0f12;border-color:var(--danger);color:#ffc9c9}
.mut{color:var(--muted)}
.right{text-align:right}
.center{text-align:center}
.num{text-align:right;font-variant-numeric:tabular-nums}
.search{max-width:260px}
.themeBtn{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:14px}
.themeBtn:hover{background:var(--panel2)}
.photoBox{width:110px;height:130px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--panel2);flex-shrink:0;font-size:11px;color:var(--muted);text-align:center;cursor:pointer}
.photoBox img{width:100%;height:100%;object-fit:cover}
.instTable input{padding:6px 8px}
.instTable td,.instTable th{padding:5px 7px}
.instTable .amt{width:110px}
.chk{width:auto;accent-color:var(--accent)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:none;color:var(--muted);padding:9px 14px;font-weight:650;font-size:13px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.bar{height:9px;border-radius:5px;background:linear-gradient(90deg,var(--purple),#6f51c4)}
.barwrap{display:grid;grid-template-columns:60px 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:12.5px}
.attgrid{display:grid;gap:8px}
.mograd{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.mocell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.mocell.paid{background:#10301f;border-color:#1e5236}
.mocell .molabel{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.mocell .mostatus{font-size:16px;font-weight:700;margin-top:2px;color:var(--muted)}
.mocell.paid .mostatus{color:#74e6b4}
.camerabox{position:relative;width:100%;max-width:420px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
.camerabox video{width:100%;height:100%;object-fit:cover;display:block}
.cameraOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px;background:#111}
.dayhead{font-size:11px;color:var(--muted);text-align:center}
.daybtn{width:30px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--input);color:var(--muted);font-size:11px;font-weight:700}
.daybtn.P{background:#10301f;color:#74e6b4;border-color:#1e5236}
.daybtn.A{background:#3a1d22;color:#ff9c9c;border-color:#5c2a30}
.daybtn.H{background:#3a2e12;color:#ffcd7a;border-color:#5c4a1e}
.printable{background:#fff;color:#111;border-radius:8px;padding:26px;max-width:720px;margin:0 auto;border:1px solid var(--line);overflow-x:auto;position:relative;isolation:isolate}
.printable.thermal{max-width:300px;padding:14px;font-family:'Courier New',monospace;font-size:11.5px}
.printable.thermal .tdash{border-top:1px dashed #999;margin:6px 0}
.printable.thermal .trow{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.printable *{color:#111 !important}
.watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;max-width:340px;opacity:.18;pointer-events:none;z-index:0}
.printable > *:not(.watermark){position:relative;z-index:1}
.idcard .watermark{width:70%;max-width:150px;opacity:.22}
.voucherbatch{display:flex;flex-direction:column;gap:22px}
.voucherCard{max-width:680px}
.admform{max-width:760px;box-sizing:border-box}
.admhead{display:flex;align-items:center;gap:14px;border-bottom:3px solid #1c8a4f;padding-bottom:10px;margin-bottom:0}
.admhead .admlogo{width:74px;height:74px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:visible}
.admhead .admlogo img{width:100%;height:100%;object-fit:contain}
.admhead .admschool{flex:1;text-align:center;min-width:0}
.admhead .admschool h1{margin:0;font-size:19px;color:#1c8a4f;letter-spacing:.02em;font-weight:800}
.admhead .admschool .admsub{font-size:11.5px;color:#333;margin-top:2px}
.admhead .admschool .admtag{font-size:11px;font-weight:700;margin-top:2px}
.admright{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.admgr{font-size:12px;white-space:nowrap}
.admtitlebar{background:#1c8a4f;color:#fff;text-align:center;font-weight:800;font-size:15px;letter-spacing:.05em;padding:7px;margin:10px 0}
.admphotobox{width:82px;height:98px;border:1px solid #111;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10.5px;color:#555;background:#fafafa;overflow:hidden;flex-shrink:0}
.admphotobox img{width:100%;height:100%;object-fit:cover}
table.admtable{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:6px}
table.admtable col.lblcol{width:22%}
table.admtable col.valcol{width:28%}
table.admtable td{border:1px solid #222;padding:6px 8px;font-size:11.5px;vertical-align:top;word-wrap:break-word;overflow-wrap:break-word;white-space:normal}
table.admtable td.bar{background:#1c1c1c;color:#fff !important;font-weight:800;letter-spacing:.04em;text-align:left;padding:5px 8px}
table.admtable td.bar.gray{background:#8a8a8a}
table.admtable td.lbl{background:#f4f4f4;font-weight:700}
table.admtable td.lbl small{display:block;font-weight:500;color:#555}
table.admtable td.val{min-height:20px}
.dobboxes{display:flex;gap:5px;flex-wrap:wrap}
.dobboxes .dbox{border:1px solid #999;border-radius:3px;padding:2px 7px;font-size:11px;min-width:28px;text-align:center;background:#fff}
.dobboxes .dlabel{font-size:8.5px;color:#777;display:block;text-align:center}
.admdecl{font-size:10.2px;line-height:1.5;color:#222 !important}
.admdocs{font-size:11px;line-height:1.7}
.admdocs b{display:block;margin-bottom:2px}
.admphotos3{display:flex;gap:8px}
.admphotos3 .pb{flex:1;border:1px solid #222;height:76px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:#555}
.idcardwrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.idcard{width:330px;max-width:100%;border-radius:12px;overflow:hidden;background:#fff;color:#111;border:1px solid #ccc;box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;flex-direction:column;position:relative;isolation:isolate}
.idcard .hd{background:linear-gradient(90deg,#2f7bff,#6f51c4);color:#fff;padding:10px 14px;font-weight:800;font-size:14px}
.idcard .bd{display:flex;gap:12px;padding:14px;flex:1}
.idcard .bd img,.idcard .bd .ph{width:78px;height:92px;border-radius:6px;object-fit:cover;object-position:center top;background:#eee;border:1px solid #ddd;flex-shrink:0}
.idcard .bd .info{font-size:12px;flex:1;min-width:0}
.idcard .bd .info b{display:block;font-size:14px;margin-bottom:2px;word-break:break-word}
.idcard .ft{background:#f2f4f8;padding:6px 14px;font-size:10.5px;color:#666}
.idcard .bd svg{display:block}
.idcard > *:not(.watermark){position:relative;z-index:1}
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 15% 15%, rgba(79,184,209,.16), transparent 40%), var(--bg)}
.loginbox{width:380px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 25px 60px rgba(10,30,40,.12)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.login-brand .brand-mark{width:52px;height:52px;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.login-brand .brand-mark img{width:100%;height:100%;object-fit:contain}
.login-brand .brand-name{font-weight:700;font-size:15px;color:var(--text);line-height:1.3;letter-spacing:.01em}
.login-brand .brand-name .b{color:var(--accent)}
.login-brand .brand-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.login-eyebrow{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.loginbox h2{margin:0 0 10px;font-size:23px;font-weight:700;letter-spacing:-.01em}
.loginbox p{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.55}
.field input{padding:11px 12px;font-size:13.8px}
.hint{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
.setuplist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.setuplist .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px}
.empty{color:var(--muted);text-align:center;padding:30px;font-size:13px}
code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12px}
@media print{
  header,nav,.sidebar,.mobile-menu,.noprint{display:none !important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .voucherbatch{gap:0}
  .voucherCard{border:none;border-radius:0;max-width:none;padding:16px}
}

</style>
</head>
<body>

<div id="loginScreen"></div>

<div id="app" class="app-shell" style="display:none">

/* ---------------- helpers ---------------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function localDateStr(d){
  // yyyy-mm-dd built from LOCAL date parts — unlike toISOString(), this doesn't shift to UTC
  // and so doesn't roll over to the wrong calendar day for timezones ahead of UTC (e.g. late-night check-ins).
  d = d || new Date();
  const p2 = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}
function money(n){n=Number(n)||0;return 'Rs. '+n.toLocaleString(undefined,{maximumFractionDigits:0});}
function num(n){return Number(n)||0;}
function toast(m,bad){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2200);}
function compressImage(file, maxDim, quality){
  // downscale + re-encode as JPEG so photos stay small enough for localStorage and cloud sync
  return new Promise((resolve, reject)=>{
    let settled = false;
    const done = (fn, val) => { if(!settled){ settled = true; clearTimeout(timer); fn(val); } };
    const timer = setTimeout(()=>done(reject, new Error('Image processing timed out')), 8000);
    const reader = new FileReader();
    reader.onerror = ()=>done(reject, new Error('Could not read file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>done(reject, new Error('Could not read image'));
      img.onload = ()=>{
        try{
          let {width, height} = img;
          if(width>maxDim || height>maxDim){
            if(width>height){ height = Math.round(height*maxDim/width); width = maxDim; }
            else { width = Math.round(width*maxDim/height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          done(resolve, canvas.toDataURL('image/jpeg', quality));
        }catch(e){ done(reject, e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function doPrint(){
  try{
    window.print();
  }catch(e){
    toast('Could not open the print dialog — try Ctrl+P (or Cmd+P on Mac) instead', true);
  }
}
function stuLabel(reg){return 'STU-'+reg;}
function initials(name){return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function watermarkTag(extraClass){
  return `<img class="watermark${extraClass?(' '+extraClass):''}" src="${LOGO_DATA_URI}" alt="">`;
}

function feesForStudent(reg){
  return DB.fees.filter(f=>f.reg===reg).sort((a,b)=>(a.recordedAt||'').localeCompare(b.recordedAt||''));
}
function studentPaid(s){return feesForStudent(s.reg).reduce((a,f)=>a+num(f.amount),0);}
function studentRemaining(s){return num(s.totalFees)-studentPaid(s);}
function addFeePayment(reg, month, amount, year, method){
  const rec = {id:uid(), reg, month, year: year||new Date().getFullYear(), amount:num(amount), method: method||'Cash', recordedAt:new Date().toISOString()};
  DB.fees.push(rec);
  saveDB();
  return rec;
}
function deleteFeePayment(id){
  DB.fees = DB.fees.filter(f=>f.id!==id);
  saveDB();
}
function monthStatusForStudent(reg, month){
  // most recent payment recorded against this month, if any
  const matches = DB.fees.filter(f=>f.reg===reg && f.month===month);
  if(!matches.length) return {isPaid:false, amount:0};
  const total = matches.reduce((a,f)=>a+num(f.amount),0);
  return {isPaid:true, amount:total};
}
function monthStatusForYear(reg, month, year){
  const matches = DB.fees.filter(f=>f.reg===reg && f.month===month && Number(f.year)===Number(year));
  if(!matches.length) return {isPaid:false, amount:0};
  return {isPaid:true, amount:matches.reduce((a,f)=>a+num(f.amount),0)};
}
function attendanceSummaryForStudent(reg, year, month){
  const key = attKey(reg, year, month);
  const rec = DB.attendance[key] || {};
  let P=0,A=0,H=0;
  Object.values(rec).forEach(v=>{ if(v==='P')P++; else if(v==='A')A++; else if(v==='H')H++; });
  return {P,A,H};
}
function dobParts(dobStr){
  // accepts YYYY-MM-DD (from <input type=date>), DD/MM/YYYY, or D-M-YYYY; returns {day,month,year} best-effort
  if(!dobStr) return {day:'',month:'',year:''};
  let m = String(dobStr).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); // yyyy-mm-dd
  if(m) return {day:m[3], month:m[2], year:m[1]};
  m = String(dobStr).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); // dd/mm/yyyy
  if(m) return {day:m[1], month:m[2], year:m[3]};
  return {day:'',month:'',year:'', raw:dobStr};
}

/* ---------------- persistence ---------------- */
function defaultDB(){
  return {
    students: [],
    fees: [], // separate fee ledger: {id, reg, month, year, amount, recordedAt}
    attendance: {}, // key `${reg}|${year}|${month}` -> {1:'P',2:'A',...}
    nextReg: 101,
    cloud: {url:'', key:'', connected:false},
    school: {
      name: 'Wings Education Inn\'s',
      address: 'City, Country',
      website: '', email: '', tagline: 'Schooling System', logo: null,
    },
    reminderTemplate: 'Dear Parent, this is a reminder that {name}\'s ({cls}) fee of {amount} for {month} is due at {school}. Kindly pay at your earliest convenience. Thank you.',
    checkinBaseUrl: '', // the public URL this file is hosted at, used to build scan-to-check-in QR links
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      // fill in any missing fields for forward-compat
      const def = defaultDB();
      DB = Object.assign(def, d);
      if(!DB.fees) DB.fees = [];
      if(!DB.attendance) DB.attendance = {};
      if(!DB.cloud) DB.cloud = {url:'', key:'', connected:false};
      if(!DB.school) DB.school = def.school;
      if(!DB.reminderTemplate) DB.reminderTemplate = def.reminderTemplate;
      if(DB.checkinBaseUrl==null) DB.checkinBaseUrl = '';
      delete DB.teachers; // teacher module removed — drop any leftover data from older saves
      delete DB.classFees; // fixed class-fee system removed — fees are set per student now
      migrateInstallmentsToFees();
    } else {
      DB = defaultDB();
    }
  }catch(e){ DB = defaultDB(); }
}
function migrateInstallmentsToFees(){
  // older versions stored fee payments as a fixed installments[] array on each student.
  // Move any of that into the separate fee ledger, then drop it from the student record.
  let migrated = false;
  DB.students.forEach(s=>{
    if(Array.isArray(s.installments)){
      s.installments.forEach(inst=>{
        if(inst.month && inst.amount>0){
          DB.fees.push({id:uid(), reg:s.reg, month:inst.month, year:new Date().getFullYear(), amount:inst.amount, recordedAt:new Date().toISOString()});
        }
      });
      delete s.installments;
      migrated = true;
    }
  });
  if(migrated) saveDB(false);
}
let saveDebounce=null;
function saveDB(pushCloud){
  // Always saved to this browser first — the app works fully offline / without any cloud connection.
  // If a cloud project is connected, the same change also lands in Supabase within a fraction of a second.
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  if(pushCloud!==false && DB.cloud.connected){
    clearTimeout(saveDebounce);
    saveDebounce = setTimeout(()=>cloudPushAll().catch(e=>toast('Cloud sync failed: '+(e.message||e), true)), 150);
  }
}

function goto(v, arg){
  closeSidebar();

  if(v==='feeCollect'){ window._feeReg = arg; window._draftFee=null; window._draftFeeKey=null; }

}
function render(){
  // preserve focus + cursor position across re-renders triggered by typing (e.g. search boxes)
  const active = document.activeElement;
  const focusId = (active && active.id) ? active.id : null;
  let selStart=null, selEnd=null;
  if(focusId && (active.tagName==='INPUT' || active.tagName==='TEXTAREA') && active.type!=='checkbox' && active.type!=='file'){
    try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){}
  }

  renderNav();
  updateCloudBadge();
  const m = document.getElementById('view');
  if(view==='dashboard') m.innerHTML = viewDashboard();
  else if(view==='students') m.innerHTML = viewStudents();
  else if(view==='studentForm') m.innerHTML = viewStudentForm();
  else if(view==='fees') m.innerHTML = viewFees();
  else if(view==='analytics') m.innerHTML = viewAnalytics();
  else if(view==='feeCollect') m.innerHTML = viewFeeCollect(window._feeReg);
  else if(view==='attendance') m.innerHTML = viewAttendance();
  else if(view==='setup') m.innerHTML = viewSetup();
  else if(view==='receipt') m.innerHTML = viewReceipt(window._receiptReg);
  else if(view==='thermalReceipt') m.innerHTML = viewThermalReceipt(window._receiptReg);
  else if(view==='admissionForm') m.innerHTML = viewAdmissionForm(window._admReg);
  else if(view==='idcardStudent') m.innerHTML = viewIDCardStudent(window._idReg);
  else if(view==='studentProfile') m.innerHTML = viewStudentProfile(window._profileReg);

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(selStart!=null){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  if(view==='attendance' && attTab==='scan'){
    const si = document.getElementById('scanInput');
    if(si) si.focus();
    if(cameraScanning && cameraStream){
      const v = document.getElementById('qrVideo');
      if(v && v.srcObject !== cameraStream){
        v.srcObject = cameraStream;
        v.play().catch(()=>{});
      }
    }
  } else if(cameraScanning){
    stopCameraScan(); // don't leave the camera running once the user leaves this screen
  }
}

function viewDashboard(){
  const S = DB.students;
  const boys = S.filter(s=>s.gender==='Male').length;
  const girls = S.filter(s=>s.gender==='Female').length;
  const news = S.filter(s=>s.studentType==='New').length;
  const olds = S.filter(s=>s.studentType==='Old').length;
  const feesCollected = S.reduce((a,s)=>a+studentPaid(s),0);
  const feesRemaining = S.reduce((a,s)=>a+studentRemaining(s),0);

  const byClass = {};
  CLASSES.forEach(c=>byClass[c]={boys:0,girls:0,total:0});
  S.forEach(s=>{
    if(!byClass[s.cls]) byClass[s.cls]={boys:0,girls:0,total:0};
    byClass[s.cls].total++;
    if(s.gender==='Male') byClass[s.cls].boys++; else byClass[s.cls].girls++;
  });
  const classRows = Object.keys(byClass).sort().map(c=>{
    const d = byClass[c];
    const pct = S.length? Math.round(d.total/S.length*100) : 0;
    return `<div class="barwrap"><div>${esc(c)}</div><div class="bar" style="width:${pct}%"></div><div class="mut">${d.total} (${d.boys}B/${d.girls}G)</div></div>`;
  }).join('') || '<div class="empty">No students yet</div>';

  return `
  <div class="cards">
    <div class="kpi"><div class="l">Total Students</div><div class="v">${S.length}</div></div>
    <div class="kpi"><div class="l">Boys / Girls</div><div class="v">${boys} / ${girls}</div></div>
    <div class="kpi"><div class="l">New / Old</div><div class="v">${news} / ${olds}</div></div>
    <div class="kpi"><div class="l">Fees Collected</div><div class="v g">${money(feesCollected)}</div></div>
    <div class="kpi"><div class="l">Fees Remaining</div><div class="v w">${money(feesRemaining)}</div></div>
  </div>
  <div class="panel">
    <h3>Students by Class</h3>
    ${classRows}
  </div>
  <div class="grid2">
    <div class="panel">
      <h3>Quick Actions</h3>
      <div class="row">
        <button class="btn pri" onclick="goto('studentForm','new')">+ Admit Student</button>
        <button class="btn ghost" onclick="goto('attendance')">Mark Attendance</button>
      </div>
    </div>
    <div class="panel">
      <h3>Recently Admitted</h3>
      ${S.slice(-5).reverse().map(s=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)">
        <span>${esc(s.name)} <span class="mut">(${stuLabel(s.reg)})</span></span>

function recordPaymentFromForm(reg){

function onClassChange(){
  const cls = document.getElementById('f_class').value;
  window._draftStudent.cls = cls;
  render();
}
function refreshStudentTotals(){
  const s = window._draftStudent;
  const paid = studentPaid(s), rem = num(s.totalFees)-paid;
  const tf=document.getElementById('tot_fees'), tp=document.getElementById('tot_paid'), tr=document.getElementById('tot_rem');
  if(tf) tf.textContent = money(s.totalFees);
  if(tp) tp.textContent = money(paid);
  if(tr){ tr.textContent = money(rem); tr.style.color = rem>0?'var(--danger)':'var(--green)'; }
}
function readAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
async function onStudentPhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    window._draftStudent.photo = await compressImage(file, 500, 0.75);
  }catch(err){
    // fall back to the raw file if compression isn't possible for some reason
    try{ window._draftStudent.photo = await readAsDataURL(file); }
    catch(e2){ toast('Could not read that image', true); return; }
  }
  render();
}
function saveStudent(isNew){
  const s = window._draftStudent;
  s.name = document.getElementById('f_name').value.trim();
  s.father = document.getElementById('f_father').value.trim();
  s.mother = document.getElementById('f_mother').value.trim();
  s.dob = document.getElementById('f_dob').value.trim();
  s.mobile = document.getElementById('f_mobile').value.trim();
  s.bform = document.getElementById('f_bform').value.trim();
  s.gender = document.getElementById('f_gender').value;
  s.religion = document.getElementById('f_religion').value;
  s.address = document.getElementById('f_address').value.trim();
  s.cls = document.getElementById('f_class').value;
  s.admissionDate = document.getElementById('f_admdate').value.trim();
  s.studentType = document.getElementById('f_stype').value;
  s.preSchool = document.getElementById('f_preschool').value.trim();
  s.pregrade = document.getElementById('f_pregrade').value;
  s.monthly = Number(document.getElementById('f_monthly').value)||0;
  s.totalFees = Number(document.getElementById('f_totalfees').value)||0;
  if(!s.name){ toast('Student name is required', true); return; }
  if(isNew){
    s.reg = DB.nextReg;
    DB.students.push(s);
    DB.nextReg++;
  } else {
    const idx = DB.students.findIndex(x=>x.reg==s.reg);
    DB.students[idx] = s;
  }
  saveDB();
  toast('Student saved');
  if(isNew){
    openAdmissionForm(s.reg); // new admission -> straight to the printable form
    doPrint();
  } else {
    goto('students');
  }
}
function deleteStudent(reg){
  if(!confirm('Delete this student? This also removes their attendance records.')) return;
  DB.students = DB.students.filter(s=>s.reg!=reg);
  Object.keys(DB.attendance).forEach(k=>{ if(k.startsWith(reg+'|')) delete DB.attendance[k]; });
  saveDB();
  toast('Student deleted');
  goto('students');
}

let feesSearch = '';
let feesFilter = 'All'; // All | Paid | Pending
let feesTab = 'thisMonth'; // 'thisMonth' | 'collect' | 'vouchers'
let voucherClass = CLASSES[0];
let voucherMonth = MONTHS[new Date().getMonth()];
let thisMonthClass = 'All';
let thisMonthMonth = MONTHS[new Date().getMonth()];
let thisMonthStatus = 'All'; // All | Paid | Unpaid

function viewFees(){
  return `
  <div class="tabs noprint">
    <button class="${feesTab==='thisMonth'?'on':''}" onclick="feesTab='thisMonth';render()">📅 This Month</button>
    <button class="${feesTab==='collect'?'on':''}" onclick="feesTab='collect';render()">💰 Collect Fee</button>

/* ---- This Month tracker: who's paid, who hasn't, class-wise ---- */
function viewFeesThisMonth(){
  const month = thisMonthMonth;
  let students = thisMonthClass==='All' ? DB.students.slice() : DB.students.filter(s=>s.cls===thisMonthClass);
  students.sort((a,b)=>a.reg-b.reg);

  const withStatus = students.map(s=>{
    const {isPaid, amount:paidAmount} = monthStatusForStudent(s.reg, month);
    return {s, isPaid, amount: isPaid ? paidAmount : (s.monthly||0)};
  });
  let rows = withStatus.filter(r=>{
    if(thisMonthStatus==='Paid') return r.isPaid;
    if(thisMonthStatus==='Unpaid') return !r.isPaid;
    return true;
  });

  const paidCount = withStatus.filter(r=>r.isPaid).length;
  const unpaidCount = withStatus.length - paidCount;
  const collected = withStatus.filter(r=>r.isPaid).reduce((a,r)=>a+r.amount,0);
  const outstanding = withStatus.filter(r=>!r.isPaid).reduce((a,r)=>a+r.amount,0);

  return `
  <div class="cards">
    <div class="kpi"><div class="l">Paid — ${esc(month)}</div><div class="v g">${paidCount}</div></div>
    <div class="kpi"><div class="l">Unpaid — ${esc(month)}</div><div class="v d">${unpaidCount}</div></div>
    <div class="kpi"><div class="l">Collected this month</div><div class="v g">${money(collected)}</div></div>
    <div class="kpi"><div class="l">Outstanding this month</div><div class="v w">${money(outstanding)}</div></div>
  </div>
  <div class="panel">
    <div class="row between" style="margin-bottom:14px">
      <h3 style="margin:0">Monthly Fee Status</h3>
      <div class="row">
        <select style="width:auto" onchange="thisMonthMonth=this.value;render()">
          ${MONTHS.map(m=>`<option ${m===month?'selected':''}>${m}</option>`).join('')}
        </select>
        <select style="width:auto" onchange="thisMonthClass=this.value;render()">
          <option ${thisMonthClass==='All'?'selected':''}>All</option>
          ${CLASSES.map(c=>`<option ${c===thisMonthClass?'selected':''}>${c}</option>`).join('')}
        </select>
        <select style="width:auto" onchange="thisMonthStatus=this.value;render()">
          ${['All','Paid','Unpaid'].map(f=>`<option ${f===thisMonthStatus?'selected':''}>${f}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="tablewrap">
    <table>
      <tr><th>Reg #</th><th>Name</th><th>Class</th><th class="right">Monthly Fee</th><th>Status</th><th></th></tr>
      ${rows.map(({s,isPaid,amount})=>`<tr>
        <td>${stuLabel(s.reg)}</td>
        <td>${esc(s.name)}</td>
        <td>${esc(s.cls)}</td>
        <td class="num">${money(amount)}</td>
        <td><span class="badge ${isPaid?'b-paid':'b-unpaid'}">${isPaid?'Paid':'Unpaid'}</span></td>
        <td>${isPaid
          ? `<button class="btn sm ghost" onclick="openReceipt(${s.reg})">Receipt</button>`
          : `<span class="row" style="gap:6px;display:inline-flex">
               <input type="number" id="qty_${s.reg}" value="${s.monthly||''}" placeholder="amount" style="width:90px" class="noprint">
               <button class="btn sm pri" onclick="collectThisMonth(${s.reg})">Collect &amp; Print</button>
             </span>`}
        </td>
      </tr>`).join('') || `<tr><td colspan="6" class="empty">No students found</td></tr>`}
    </table>
    </div>
  </div>`;
}
function collectThisMonth(reg){
  const s = DB.students.find(x=>x.reg==reg);
  if(!s){ toast('Student not found', true); return; }
  const input = document.getElementById('qty_'+reg);
  const amount = input ? (Number(input.value)||0) : (s.monthly||0);
  if(amount<=0){ toast('Enter a fee amount before collecting', true); return; }
  addFeePayment(reg, thisMonthMonth, amount);
  toast(`${thisMonthMonth} fee collected for ${s.name}`);
  openReceipt(reg);
  doPrint();
}

/* ---- Reminders: one-click email / WhatsApp for unpaid students ---- */
let remindersClass = 'All';
let remindersMonth = MONTHS[new Date().getMonth()];
function buildReminderMessage(s, month, amount){
  return DB.reminderTemplate
    .replace(/{name}/g, s.name||'')
    .replace(/{cls}/g, s.cls||'')
    .replace(/{amount}/g, money(amount))
    .replace(/{month}/g, month)
    .replace(/{school}/g, DB.school.name||'the school');
}
function phoneForWhatsApp(raw){
  // best-effort: strip everything but digits, turn a leading 0 into Pakistan's 92 country code
  let digits = String(raw||'').replace(/\D/g,'');
  if(!digits) return '';
  if(digits.startsWith('0')) digits = '92'+digits.slice(1);
  return digits;
}
function sendEmailReminder(reg){
  const s = DB.students.find(x=>x.reg==reg);
  if(!s) return;
  if(!s.parentEmail){ toast('No parent email on file for '+s.name, true); return; }
  const msg = buildReminderMessage(s, remindersMonth, s.monthly||0);
  const subject = encodeURIComponent(`Fee Reminder — ${s.name} (${remindersMonth})`);
  const body = encodeURIComponent(msg);
  window.open(`mailto:${s.parentEmail}?subject=${subject}&body=${body}`, '_blank');
}
function sendWhatsAppReminder(reg){
  const s = DB.students.find(x=>x.reg==reg);
  if(!s) return;
  const phone = phoneForWhatsApp(s.fatherHomePhone || s.mobile);
  if(!phone){ toast('No phone number on file for '+s.name, true); return; }
  const msg = buildReminderMessage(s, remindersMonth, s.monthly||0);
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');

function revenueByMonth(monthsBack){
  monthsBack = monthsBack || 12;
  const now = new Date();
  const buckets = [];
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({year:d.getFullYear(), monthIdx:d.getMonth(), label:MONTHS[d.getMonth()].slice(0,3)+" '"+String(d.getFullYear()).slice(2), amount:0});
  }
  DB.fees.forEach(f=>{
    const mi = MONTHS.indexOf(f.month);
    if(mi<0) return;
    const b = buckets.find(x=>x.year===Number(f.year) && x.monthIdx===mi);
    if(b) b.amount += num(f.amount);
  });
  return buckets;
}
function revenueByClass(){
  const byClass = {};
  CLASSES.forEach(c=>byClass[c]=0);
  DB.fees.forEach(f=>{
    const s = DB.students.find(x=>x.reg===f.reg);
    if(!s) return;
    byClass[s.cls] = (byClass[s.cls]||0) + num(f.amount);
  });
  return CLASSES.map(c=>({cls:c, amount:byClass[c]||0})).filter(r=>r.amount>0 || DB.students.some(s=>s.cls===r.cls));
}
function quarterlyProjectionVsActual(year){
  const quarters = [
    {label:'Q1 (Jan–Mar)', months:[0,1,2]},
    {label:'Q2 (Apr–Jun)', months:[3,4,5]},
    {label:'Q3 (Jul–Sep)', months:[6,7,8]},
    {label:'Q4 (Oct–Dec)', months:[9,10,11]},
  ];
  const monthlyTotal = DB.students.reduce((a,s)=>a+num(s.monthly),0);
  return quarters.map(q=>{
    const projected = monthlyTotal*3; // current roster's monthly fee × 3 months, as a simple projection
    const actual = DB.fees.filter(f=>Number(f.year)===year && q.months.includes(MONTHS.indexOf(f.month))).reduce((a,f)=>a+num(f.amount),0);
    return {label:q.label, projected, actual};
  });
}
function svgBarChart(data, opts){
  opts = opts || {};
  const w = opts.width||640, h = opts.height||220, pad = 34;
  const max = Math.max(1, ...data.map(d=>d.amount));
  const bw = (w-pad*2)/data.length;
  const bars = data.map((d,i)=>{
    const bh = Math.round((d.amount/max)*(h-pad*2));
    const x = pad + i*bw + bw*0.15;
    const y = h-pad-bh;
    const bwi = bw*0.7;
    return `<rect x="${x}" y="${y}" width="${bwi}" height="${bh}" rx="3" fill="var(--accent)"></rect>
      <text x="${x+bwi/2}" y="${h-pad+16}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${esc(d.label)}</text>
      ${d.amount>0?`<text x="${x+bwi/2}" y="${y-5}" text-anchor="middle" font-size="9" fill="var(--text)">${Math.round(d.amount/1000)}k</text>`:''}`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"></line>
    ${bars}
  </svg>`;
}
function svgGroupedBarChart(data, opts){
  opts = opts || {};
  const w = opts.width||640, h = opts.height||240, pad = 40;
  const max = Math.max(1, ...data.map(d=>Math.max(d.projected,d.actual)));
  const groupW = (w-pad*2)/data.length;
  const barW = groupW*0.28;
  const bars = data.map((d,i)=>{
    const gx = pad + i*groupW + groupW*0.15;
    const ph = Math.round((d.projected/max)*(h-pad*2));
    const ah = Math.round((d.actual/max)*(h-pad*2));
    return `
      <rect x="${gx}" y="${h-pad-ph}" width="${barW}" height="${ph}" rx="3" fill="var(--purple)" opacity="0.55"></rect>
      <rect x="${gx+barW+6}" y="${h-pad-ah}" width="${barW}" height="${ah}" rx="3" fill="var(--green)"></rect>
      <text x="${gx+barW+3}" y="${h-pad+16}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${esc(d.label)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"></line>
    ${bars}
  </svg>
  <div class="row" style="gap:16px;margin-top:6px;font-size:12px" class="mut">
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--purple);opacity:.55;border-radius:2px;margin-right:5px"></span>Projected</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--green);border-radius:2px;margin-right:5px"></span>Actual</span>
  </div>`;
}

function processCardScan(value, dateStr){
  let raw = String(value||'').trim();
  if(/^https?:\/\//i.test(raw)){
    // a scanner reading the new link-style QR types out the full URL — pull the actual card value back out of it
    try{
      const u = new URL(raw);
      const ci = u.searchParams.get('ci');
      if(ci) raw = ci;
    }catch(e){ /* not a valid URL — fall through and try matching the raw text as-is */ }
  }
  if(!raw) return;
  let student = DB.students.find(s=>s.cardId && s.cardId===raw);
  if(!student){
    const regGuess = raw.replace(/^STU-/i,'').replace(/\D/g,'');
    if(regGuess) student = DB.students.find(s=>String(s.reg)===regGuess);
  }
  if(!student){
    scanFlash = {ok:false, msg:`No student found for card "${raw}"`};
    render();
    return;
  }
  const d = new Date(dateStr+'T00:00:00');
  const key = attKey(student.reg, d.getFullYear(), d.getMonth()+1);
  if(!DB.attendance[key]) DB.attendance[key] = {};
  const day = d.getDate();
  const already = DB.attendance[key][day] === 'P';
  DB.attendance[key][day] = 'P';
  saveDB();
  if(!already){
    window._scanLog = window._scanLog || [];
    window._scanLog.unshift({reg:student.reg, name:student.name, cls:student.cls, time:new Date().toLocaleTimeString()});
    if(window._scanLog.length>50) window._scanLog.length = 50;
  }
  scanFlash = {ok:true, already, name:student.name, cls:student.cls, reg:student.reg, photo:student.photo};
  render();
}

/* ---- Built-in camera QR scanning (jsQR, runs entirely in-browser) ---- */
let scanMode = 'keyboard'; // 'keyboard' | 'camera'
let cameraScanning = false;
let cameraStream = null;
let lastCameraScanValue = null;
let lastCameraScanTime = 0;
async function startCameraScan(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("Camera access needs this page opened over HTTPS (or a proper web server) — it won't work from a local file.", true);
    return;
  }
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){
    toast('Could not access the camera: '+(e.message||e), true);
    return;
  }
  cameraScanning = true;
  render();
  requestAnimationFrame(cameraScanLoop);
}
function stopCameraScan(){
  cameraScanning = false;
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
  render();
}
function cameraScanLoop(){
  if(!cameraScanning) return;
  const video = document.getElementById('qrVideo');
  const canvas = document.getElementById('qrCanvas');
  if(video && canvas && video.readyState === video.HAVE_ENOUGH_DATA && typeof jsQR==='function'){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    try{
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if(code && code.data){
        const now = Date.now();
        if(code.data !== lastCameraScanValue || now - lastCameraScanTime > 3000){
          lastCameraScanValue = code.data;
          lastCameraScanTime = now;
          processCardScan(code.data, attDate);
        }
      }
    }catch(e){ /* ignore transient decode errors */ }
  }
  requestAnimationFrame(cameraScanLoop);
}

  render();

function checkinUrl(scanValue){
  if(!DB.cloud.connected || !DB.checkinBaseUrl) return null;
  const base = DB.checkinBaseUrl.trim().replace(/\/+$/,'');

  const params = new URLSearchParams({ci: scanValue, su: DB.cloud.url, sk: DB.cloud.key});
  return `${base}?${params.toString()}`;
}
function qrSvg(text, cellSize, margin, ecLevel){
  try{
    const qr = qrcode(0, ecLevel||'M');
    qr.addData(String(text));
    qr.make();
    return qr.createSvgTag(cellSize||4, margin==null?8:margin);
  }catch(e){
    return `<div class="mut" style="font-size:11px">QR code unavailable</div>`;
  }
}

/* ================================================================
   CLOUD SYNC (Supabase) — the ONLY copy of the data, live. Four tables:
   sms_students, sms_fees, sms_attendance, sms_settings (school profile /
   reminder template / check-in URL). Nothing is cached in this browser;
   every save pushes up within a fraction of a second, and the app pulls
   continuously while you're on the Attendance screen so every device
   stays in sync.
   ================================================================ */
function toDBStudent(s){
  return {
    reg:s.reg, name:s.name, father:s.father, mother:s.mother, dob:s.dob, mobile:s.mobile, bform:s.bform,
    address:s.address, gender:s.gender, religion:s.religion, cls:s.cls, admission_date:s.admissionDate,
    pre_school:s.preSchool, pregrade:s.pregrade, student_type:s.studentType, photo:s.photo,
    monthly:s.monthly, total_fees:s.totalFees,
    gr_no:s.grNo, nationality:s.nationality, dob_words:s.dobWords, reason_to_change:s.reasonToChange,
    health_issue:s.healthIssue, father_cnic:s.fatherCnic, father_home_phone:s.fatherHomePhone,
    father_office_phone:s.fatherOfficePhone, father_occupation:s.fatherOccupation,
    mother_cnic:s.motherCnic, mother_home_phone:s.motherHomePhone, mother_office_phone:s.motherOfficePhone,
    mother_occupation:s.motherOccupation, parent_email:s.parentEmail, card_id:s.cardId,
  };
}
function fromDBStudent(r){
  return {
    reg:r.reg, name:r.name||'', father:r.father||'', mother:r.mother||'', dob:r.dob||'', mobile:r.mobile||'',
    bform:r.bform||'', address:r.address||'', gender:r.gender||'Male', religion:r.religion||'Islam',
    cls:r.cls||CLASSES[0], admissionDate:r.admission_date||'', preSchool:r.pre_school||'',
    pregrade:r.pregrade||PREGRADES[0], studentType:r.student_type||'New', photo:r.photo||null,
    monthly:r.monthly||0, totalFees:r.total_fees||0,
    grNo:r.gr_no||'', nationality:r.nationality||'', dobWords:r.dob_words||'', reasonToChange:r.reason_to_change||'',
    healthIssue:r.health_issue||'', fatherCnic:r.father_cnic||'', fatherHomePhone:r.father_home_phone||'',
    fatherOfficePhone:r.father_office_phone||'', fatherOccupation:r.father_occupation||'',
    motherCnic:r.mother_cnic||'', motherHomePhone:r.mother_home_phone||'', motherOfficePhone:r.mother_office_phone||'',
    motherOccupation:r.mother_occupation||'', parentEmail:r.parent_email||'', cardId:r.card_id||'',
  };
}
function toDBFee(f){
  return {id:f.id, reg:f.reg, month:f.month, year:f.year, amount:f.amount, method:f.method||'Cash', recorded_at:f.recordedAt};
}
function fromDBFee(r){
  return {id:r.id, reg:r.reg, month:r.month||'', year:r.year||new Date().getFullYear(), amount:r.amount||0, method:r.method||'Cash', recordedAt:r.recorded_at||new Date().toISOString()};
}
function toDBAttendanceRows(){
  // flatten the nested {reg|year|month: {day: mark}} structure into one row per marked day
  const rows = [];
  Object.keys(DB.attendance).forEach(key=>{
    const [reg, year, month] = key.split('|');
    const days = DB.attendance[key];
    Object.keys(days).forEach(day=>{
      const date = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      rows.push({id:`${reg}_${date}`, reg:Number(reg), date, status:days[day]});
    });
  });
  return rows;
}
function mergeDBAttendanceRow(row){
  const d = new Date(row.date+'T00:00:00');
  const key = `${row.reg}|${d.getFullYear()}|${d.getMonth()+1}`;
  if(!DB.attendance[key]) DB.attendance[key] = {};
  DB.attendance[key][d.getDate()] = row.status;
}
function toDBSettings(){
  return {
    id:'default',
    school_name:DB.school.name, school_address:DB.school.address, school_tagline:DB.school.tagline,
    school_website:DB.school.website, school_email:DB.school.email, school_logo:DB.school.logo,
    reminder_template:DB.reminderTemplate, checkin_base_url:DB.checkinBaseUrl,
  };
}
function applyDBSettings(r){
  if(!r) return;
  DB.school = {
    name: r.school_name || DB.school.name, address: r.school_address || DB.school.address,
    tagline: r.school_tagline || DB.school.tagline, website: r.school_website || '',
    email: r.school_email || '', logo: r.school_logo || null,
  };
  if(r.reminder_template) DB.reminderTemplate = r.reminder_template;
  if(r.checkin_base_url) DB.checkinBaseUrl = r.checkin_base_url;
}
async function connectCloud(){
  const url = document.getElementById('cloudUrl').value.trim();
  const key = document.getElementById('cloudKey').value.trim();
  if(!url || !key){ toast('Enter both the URL and the key', true); return; }
  try{
    sb = window.supabase.createClient(url, key);
    const {error} = await sb.from('sms_students').select('reg').limit(1);
    if(error) throw error;
    DB.cloud = {url, key, connected:true};
    saveDB(false);
    toast('Connected — syncing…');
    await cloudSyncNow();
    startCloudPolling();
    render();
  }catch(e){
    toast('Could not connect: '+(e.message||e), true);
  }
}
function disconnectCloud(){
  stopCloudPolling();
  DB.cloud.connected = false;
  saveDB(false);
  render();
  toast('Disconnected — back to local only');
}
async function cloudPullAll(){
  if(!DB.cloud.connected) return 0;
  if(!sb) sb = window.supabase.createClient(DB.cloud.url, DB.cloud.key);
  let added = 0;

  const {data:studentRows, error:studentErr} = await sb.from('sms_students').select('*');
  if(studentErr) throw studentErr;
  if(studentRows){
    const localRegs = new Set(DB.students.map(s=>s.reg));
    studentRows.forEach(row=>{
      if(!localRegs.has(row.reg)){ DB.students.push(fromDBStudent(row)); added++; }
    });
    const maxReg = DB.students.reduce((m,s)=>Math.max(m, Number(s.reg)||0), DB.nextReg-1);
    DB.nextReg = maxReg+1;
  }

  const {data:feeRows, error:feeErr} = await sb.from('sms_fees').select('*');
  if(feeErr) throw feeErr;
  if(feeRows){
    const localIds = new Set(DB.fees.map(f=>f.id));
    feeRows.forEach(row=>{
      if(!localIds.has(row.id)){ DB.fees.push(fromDBFee(row)); added++; }
    });
  }

  const {data:attRows, error:attErr} = await sb.from('sms_attendance').select('*');
  if(attErr) throw attErr;
  if(attRows){
    attRows.forEach(row=>mergeDBAttendanceRow(row)); // attendance is idempotent to merge — same day just overwrites with the same mark
  }

  const {data:settingsRows, error:settingsErr} = await sb.from('sms_settings').select('*').eq('id','default').limit(1);
  if(settingsErr) throw settingsErr;
  if(settingsRows && settingsRows.length) applyDBSettings(settingsRows[0]);

  return added;
}
async function cloudPushAll(){
  if(!DB.cloud.connected) return;
  if(!sb) sb = window.supabase.createClient(DB.cloud.url, DB.cloud.key);
  if(DB.students.length) await sb.from('sms_students').upsert(DB.students.map(toDBStudent));
  if(DB.fees.length) await sb.from('sms_fees').upsert(DB.fees.map(toDBFee));
  const attRows = toDBAttendanceRows();
  if(attRows.length) await sb.from('sms_attendance').upsert(attRows);
  await sb.from('sms_settings').upsert([toDBSettings()]);
}
async function cloudSyncNow(){
  if(!DB.cloud.connected) return;
  try{
    const added = await cloudPullAll();
    await cloudPushAll();
    if(added) toast(`Synced — pulled ${added} new record(s) from the cloud`);
    render();
  }catch(e){
    toast('Sync failed: '+(e.message||e), true);
  }
}
let cloudPollTimer = null;
function startCloudPolling(){
  stopCloudPolling();
  if(!DB.cloud.connected) return;
  cloudPollTimer = setInterval(()=>{
    if(view==='attendance' && document.visibilityState==='visible'){
      cloudSyncNow().catch(()=>{});
    }
  }, 15000); // every 15s while the Attendance tab is open and the browser tab is in the foreground
}
function stopCloudPolling(){
  clearInterval(cloudPollTimer);
  cloudPollTimer = null;
}

/* ================================================================
   BOOT — local storage loads instantly and the app works fully offline.
   If a cloud project is already connected from a previous session, it
   syncs quietly in the background right after, then keeps polling.
   ================================================================ */
function boot(){
  loadDB();
  document.getElementById('nav').innerHTML='';
  render();
  if(DB.cloud && DB.cloud.connected){
    cloudSyncNow().catch(()=>{}); // pick up anything changed on another device since we last opened the app
    startCloudPolling();
  }
}
window.addEventListener('DOMContentLoaded', ()=>{
  const urlParams = new URLSearchParams(location.search);
  const ciValue = urlParams.get('ci');
  if(ciValue){
    runCheckin(ciValue, urlParams.get('su'), urlParams.get('sk'));
    return; // this is a public scan-to-check-in visit — skip the normal login/admin app entirely
  }
  const prefersDark = (typeof matchMedia==='function') && matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(localStorage.getItem(LS_THEME) || (prefersDark?'dark':'light'));
  if(sessionStorage.getItem('sms_logged_in')==='1'){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='flex';
    boot();
  } else {
    renderLogin();
  }
});

/* ---- Public check-in page: reached only via a scanned QR link. No admin
   login required — it talks directly to Supabase using the credentials
   carried in the URL, so it works from any visitor's phone. ---- */
async function runCheckin(cardValue, supaUrl, supaKey){
  const prefersDark = (typeof matchMedia==='function') && matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark?'dark':'light');
  const el = document.getElementById('loginScreen');
  el.innerHTML = `
    <div class="loginwrap">
      <div class="loginbox" style="text-align:center">
        <div class="login-brand" style="justify-content:center"><div class="brand-mark"><img src="${LOGO_DATA_URI}" alt=""></div></div>
        <h2>Attendance Check-In</h2>
        <p id="ciStatus" style="margin:18px 0;font-size:14px">⏳ Marking your attendance…</p>
      </div>
    </div>`;
  const statusEl = document.getElementById('ciStatus');
  if(!supaUrl || !supaKey){
    statusEl.innerHTML = '⚠️ This check-in link is missing its setup info. Please ask the school office to reprint your ID card.';
    return;
  }
  if(typeof window.supabase === 'undefined'){
    statusEl.innerHTML = '⚠️ Could not load required libraries — check your internet connection and try again.';
    return;
  }
  try{
    const sbc = window.supabase.createClient(supaUrl, supaKey);
    let student = null;
    const byCard = await sbc.from('sms_students').select('*').eq('card_id', cardValue).limit(1);
    if(byCard.error) throw byCard.error;
    if(byCard.data && byCard.data.length) student = byCard.data[0];
    if(!student){
      const regGuess = String(cardValue).replace(/^STU-/i,'').replace(/\D/g,'');
      if(regGuess){
        const byReg = await sbc.from('sms_students').select('*').eq('reg', Number(regGuess)).limit(1);
        if(byReg.error) throw byReg.error;
        if(byReg.data && byReg.data.length) student = byReg.data[0];
      }
    }
    if(!student){
      statusEl.innerHTML = '❌ No student found for this card. Please contact the school office.';
      return;
    }
    const today = new Date();
    const dateStr = localDateStr(today); // local calendar date — matters most late at night, when UTC's date can differ from the local one
    const attRow = {id:`${student.reg}_${dateStr}`, reg:student.reg, date:dateStr, status:'P'};
    const up = await sbc.from('sms_attendance').upsert([attRow]);
    if(up.error) throw up.error;
    statusEl.innerHTML = `✅ Attendance marked for <b>${esc(student.name)}</b><br><span class="mut">${esc(student.cls)} · ${today.toLocaleDateString()} ${today.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>`;
  }catch(e){
    statusEl.innerHTML = '⚠️ Something went wrong: ' + esc(e.message || String(e));
  }
}
